<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平台汇总与周趋势</title>
  <style>
    :root {
      --fg: #2C2925;
      --fg-2: #6A645C;
      --fg-3: #8F877C;
      --fg-4: #A39C92;
      --editor: #F4F0E8;
      --chrome: #FCFAF6;
      --fill-1: #2C292514;
      --fill-2: #2C29250E;
      --fill-3: #FCFAF6;
      --fill-4: #EFEAE2;
      --stroke-1: #D8D0C4;
      --stroke-2: #E4DDD2;
      --stroke-3: #EDE7DC;
      --accent: #3D6B66;
      --accent-hover: #335A56;
      --on-accent: #F8F6F1;
      --link: #3D6B66;
      --green: #4A7C59;
      --orange: #C4844A;
      --red: #B85C4C;
      --cyan: #5B7F8A;
      --yellow: #B0892C;
      --gray: #8A8378;
      --success-fill: #E8F1EA;
      --warning-fill: #F6EDE2;
      --danger-fill: #F6E6E2;
      --info-fill: #E6EFED;
      --grid: #E6E0D6;
      --chart-label: #6A645C;
      --chart-value: #2C2925;
      --chart-hole: #FCFAF6;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--editor);
      color: var(--fg);
      font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color-scheme: light;
    }
    body { padding: 28px 32px 64px; max-width: 1120px; }
    .stack { display: flex; flex-direction: column; }
    .row { display: flex; flex-wrap: wrap; align-items: center; }
    .grid { display: grid; gap: 12px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    @media (max-width: 900px) {
      .grid-4, .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 590; color: var(--fg); }
    h2 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 590; color: var(--fg); }
    .text { margin: 0; color: var(--fg); }
    .text-2 { color: var(--fg-2); }
    .text-3 { color: var(--fg-3); font-size: 12px; line-height: 16px; }
    .text-sm { font-size: 12px; line-height: 16px; }
    .pill {
      border: 1px solid var(--stroke-1);
      background: var(--chrome);
      color: var(--fg-2);
      border-radius: 9999px;
      padding: 5px 13px;
      font-size: 13px;
      line-height: 18px;
      cursor: pointer;
    }
    .pill:hover { border-color: var(--accent); color: var(--accent); }
    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }
    .stat {
      border: 1px solid var(--stroke-2);
      background: var(--chrome);
      border-radius: 10px;
      padding: 14px 16px;
      min-width: 0;
    }
    .stat .v { font-size: 22px; line-height: 28px; font-weight: 590; letter-spacing: -0.02em; }
    .stat .l { margin-top: 4px; font-size: 12px; line-height: 16px; color: var(--fg-2); }
    .stat.success .v { color: var(--green); }
    .stat.warning .v { color: var(--yellow); }
    .stat.danger .v { color: var(--red); }
    .callout {
      border: 1px solid var(--stroke-2);
      border-left: 3px solid var(--gray);
      background: var(--chrome);
      border-radius: 10px;
      padding: 12px 16px;
    }
    .callout.info { border-left-color: var(--accent); background: var(--info-fill); }
    .callout.warning { border-left-color: var(--orange); background: var(--warning-fill); }
    .callout.danger { border-left-color: var(--red); background: var(--danger-fill); }
    .callout.success { border-left-color: var(--green); background: var(--success-fill); }
    .callout.neutral { border-left-color: var(--gray); }
    .callout .t { font-weight: 590; margin-bottom: 4px; }
    .callout .b { color: var(--fg-2); }
    .table-wrap {
      border: 1px solid var(--stroke-2);
      border-radius: 10px;
      overflow: auto;
      max-height: 640px;
      background: var(--chrome);
    }
    table { border-collapse: collapse; width: 100%; font-size: 12px; line-height: 16px; }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--stroke-3);
      vertical-align: top;
      white-space: nowrap;
    }
    td.wrap { white-space: normal; min-width: 180px; max-width: 360px; }
    thead th {
      position: sticky; top: 0; z-index: 1;
      background: #EFEAE2;
      color: var(--fg-2);
      font-weight: 590;
      text-align: left;
    }
    tbody tr:nth-child(even) td { background: #F7F3EC; }
    .dot { display: inline-block; width: 7px; height: 7px; border-radius: 99px; margin-right: 6px; vertical-align: middle; }
    .dot.success { background: var(--green); }
    .dot.warning { background: var(--yellow); }
    .dot.danger { background: var(--red); }
    .dot.info { background: var(--accent); }
    .dot.neutral { background: var(--gray); }
    select {
      width: 100%;
      background: var(--chrome);
      color: var(--fg);
      border: 1px solid var(--stroke-1);
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); font-size: 12px; }
    .chart { width: 100%; overflow: visible; }
    .bar-row { display: grid; grid-template-columns: 160px 1fr 36px; gap: 8px; align-items: center; font-size: 12px; }
    .bar-track { height: 10px; background: #E8E2D8; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 99px; background: var(--accent); }
  </style>
</head>
